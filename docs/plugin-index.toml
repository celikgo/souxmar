# ---- in-tree opt-in adapters ------------------------------------------
#
# Five external-binary adapters live under examples/plugins/ but build
# only when their respective SOUXMAR_WITH_* CMake flag is on and the
# external dependency is reachable. They appear in the index so users
# searching for a CFD or CAD path can find them; the `paid` flag stays
# false (they're open-source) but installation is the user's
# responsibility.

[[plugin]]
id           = "dev.souxmar.examples.occt-reader"
name         = "OpenCASCADE CAD reader"
description  = "Reads STEP and IGES CAD files via OpenCASCADE. Opt-in: requires `-DSOUXMAR_WITH_OPENCASCADE=ON` and OCCT 7.x at build time."
capabilities = ["reader.step", "reader.iges"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/occt-reader"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "passed"
conformance_date = "2026-05-11"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.gmsh-mesher"
name         = "Gmsh tetrahedral mesher"
description  = "Embeds Gmsh as a library. Production-grade tetrahedralisation; advancing-front + Delaunay strategies. Opt-in: `-DSOUXMAR_WITH_GMSH=ON`."
capabilities = ["mesher.tetra.gmsh"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/gmsh-mesher"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "passed"
conformance_date = "2026-05-11"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.fenicsx-solver"
name         = "FEniCSx FEM solver (Poisson)"
description  = "Routes a souxmar Mesh + BCs through DOLFINx; consumes the DOLFINx solution back into a souxmar Field. v1 covers Poisson — broader element coverage tracks DOLFINx releases. Opt-in: `-DSOUXMAR_WITH_FENICSX=ON`."
capabilities = ["solver.fem.poisson"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/fenicsx-solver"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "passed"
conformance_date = "2026-05-11"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.openfoam-solver"
name         = "OpenFOAM CFD adapter"
description  = "Invokes simpleFoam / pimpleFoam / interFoam via subprocess per ADR-0009 (no GPL linking). Mixed-element polyMesh translator (Tet4 / Hex8 / Prism6 / Pyramid5) + per-patch BC routing via the v1.3 per-face-tag ABI. Opt-in: `-DSOUXMAR_WITH_OPENFOAM=ON`."
capabilities = ["solver.cfd.openfoam.simple", "solver.cfd.openfoam.pimple", "solver.cfd.openfoam.inter"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/openfoam-solver"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "passed"
conformance_date = "2026-05-11"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.blender-reader"
name         = "Blender .blend importer"
description  = "Reads Blender .blend files via the same subprocess harness OpenFOAM uses (bpy.ops.wm.obj_export → OBJ → souxmar mesh). Round-trips named collections to per-cell tags. Opt-in: `-DSOUXMAR_WITH_BLENDER=ON` and Blender 4.x on PATH."
capabilities = ["reader.blend"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/blender-reader"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "passed"
conformance_date = "2026-05-11"
status           = "active"

# ---- in-tree manufacturing + marine plugins (always-on) ---------------
#
# Eight plugins carrying 18 capabilities for additive manufacturing and
# marine / subsea work. Built unconditionally like the reference set
# above; no external dependency, no CMake flag.
#
# Every model here is closed-form or heuristic, with a named literature
# reference and an explicit "what this is NOT" note in its source
# header. They are screening and preliminary-sizing aids, not calibrated
# process simulations, and the marine qualification dossier is advisory
# only — souxmar is not a classification society.
#
# `conformance = "not_run"` on all eight: no conformance attestation has
# been produced for these binaries yet. The index states that rather
# than inheriting the reference set's badge.

[[plugin]]
id           = "dev.souxmar.examples.am-layered-mesher"
name         = "AM Layered Voxel Mesher"
description  = "Layer-aligned structured Hex8 build mesh for additive-manufacturing process simulation. Cell tag = layer index; outer faces tagged 10..15 per side."
capabilities = ["mesher.am.layered"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-layered-mesher"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.lattice-reader"
name         = "Parametric Strut-Lattice Reader"
description  = "Generates a periodic strut-lattice beam mesh (cubic / bcc / fcc / octet / diamond) from a lattice spec file. Edge2 cells, cell tag = strut family."
capabilities = ["reader.lattice"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/lattice-reader"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.am-thermal"
name         = "LPBF Thermal History + Melt Pool"
description  = "Layer-wise LPBF thermal history from the Rosenthal moving point source, plus melt-pool depth, normalised enthalpy and lack-of-fusion/keyhole porosity risk. Closed-form screening model, not a resolved melt-pool CFD."
capabilities = ["solver.am.thermal.lpbf", "postproc.am.melt_pool"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-thermal"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.am-distortion"
name         = "AM Distortion + Residual Stress"
description  = "Part-scale AM distortion by the Keller-Ploshikhin inherent-strain method with Stoney-type layer-wise curvature accumulation, plus an elastic residual-stress read-back with a yield cap. The strain-calibration factor must be fitted to a measured part."
capabilities = ["solver.am.distortion.inherent_strain", "postproc.am.residual_stress"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-distortion"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.am-polymer"
name         = "Polymer AM Thermal + Bond Strength"
description  = "FFF/FDM interlayer thermal cycling (lumped-capacitance road cooling) plus Yang-Pitchumani reptation healing for interlayer degree of healing and Z-strength fraction."
capabilities = ["solver.am.polymer.fff", "postproc.am.bond_strength"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-polymer"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.am-manufacturability"
name         = "AM Manufacturability Checks"
description  = "Design-for-additive-manufacturing checks: per-cell overhang/support need, a composite printability score, and per-layer build time from the mesh's own boundary facets. Registered as solver.* because postproc.* requires an input field and a mesh-only check has none. The printability score is a documented weighting, not a guarantee."
capabilities = ["solver.am.overhang", "solver.am.printability", "solver.am.buildtime"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-manufacturability"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.am-slicer"
name         = "AM Slicer: G-code, CLI, build report"
description  = "Slices the mesh boundary with planar layers and emits FFF G-code, Common Layer Interface ASCII, or a Markdown build report with a non-cryptographic FNV-1a content digest. Single perimeter, no offset compensation, no support generation, no bridging logic; generic flavour, not a per-vendor post-processor."
capabilities = ["writer.am.gcode", "writer.am.cli", "writer.am.report"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-slicer"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"

[[plugin]]
id           = "dev.souxmar.examples.marine"
name         = "Marine / Subsea Loads and Integrity"
description  = "Closed-form marine engineering set: seawater hydrostatic load cases, preliminary pressure-hull collapse margin, seawater corrosion / pitting / galvanic indicators, and an advisory AM qualification dossier. Preliminary design aids, not classification-society calculations."
capabilities = ["solver.marine.hydrostatic", "solver.marine.hull_collapse", "solver.marine.corrosion", "writer.marine.qualification_report"]
license      = "Apache-2.0"
source       = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/marine"
author       = "souxmar project"
souxmar_versions = ">=1.0,<2.0"
conformance      = "not_run"
status           = "active"
