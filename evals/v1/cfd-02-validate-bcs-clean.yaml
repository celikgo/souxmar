id: cfd-02-validate-bcs-clean
description: validate_bcs raises no error-severity issue for a properly-set duct.
category: cfd
steps:
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.grid
      target_size: 0.5
  - tool: apply_inlet
    inputs:
      tag: inlet
      velocity: [1.0, 0.0, 0.0]
  - tool: apply_wall
    inputs:
      tag: walls
      condition: no_slip
  - tool: apply_outlet
    inputs:
      tag: outlet
      pressure: 0.0
  - tool: validate_bcs
    inputs: {}
assertions:
  - kind: tool_outcome
    value: ok
  - kind: tool_data_equals
    path: ok
    value: true
  - kind: tool_data_equals
    path: counts.inlet
    value: 1
  - kind: tool_data_equals
    path: counts.outlet
    value: 1
