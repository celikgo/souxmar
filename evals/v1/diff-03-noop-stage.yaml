id: diff-03-noop-stage
description: apply_pipeline_diff with no ops returns the base unchanged, not an error.
category: diff
steps:
  - tool: apply_pipeline_diff
    inputs:
      base:
        version: 1
        stages:
          - id: mesh
            plugin: mesher.tetra.hello
      ops: []
assertions:
  - kind: tool_outcome
    value: ok
  - kind: tool_data_equals
    path: ops_applied
    value: 0
  - kind: tool_data_equals
    path: parsed_stages
    value: 1
