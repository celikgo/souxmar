id: export-01-vtu
description: export_results writes a VTU after a heat solve.
category: export
steps:
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.hello
  - tool: set_material
    inputs:
      tag: bulk
      model: thermal
      properties:
        thermal_conductivity: 45.0
  - tool: set_bc
    inputs:
      tag: fixed
      type: dirichlet
      value: 300
  - tool: solve
    inputs:
      capability_id: solver.heat.linear
  - tool: export_results
    inputs:
      capability_id: writer.vtu
      path: /tmp/souxmar-eval-export-01.vtu
assertions:
  - kind: tool_outcome
    value: ok
  - kind: tool_data_equals
    path: capability_id
    value: writer.vtu
  - kind: tool_data_equals
    path: path
    value: /tmp/souxmar-eval-export-01.vtu
  - kind: tool_data_equals
    path: has_field
    value: true
