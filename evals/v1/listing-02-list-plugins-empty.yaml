id: listing-02-list-plugins-empty
description: list_plugins reports cleanly when the namespace filter matches nothing.
category: listing
steps:
  # The runner shares one loaded registry across every task, so a task cannot
  # empty it. Filtering to a namespace nothing registers exercises the same
  # empty-result path.
  - tool: list_plugins
    inputs:
      namespace: nosuch.
assertions:
  - kind: tool_outcome
    value: ok
  - kind: tool_data_equals
    path: count_total
    value: 0
  - kind: tool_data_equals
    path: filter_namespace
    value: nosuch.
