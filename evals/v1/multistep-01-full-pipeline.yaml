id: multistep-01-full-pipeline
description: Mesh -> material -> BC -> solve -> query -> export, end-to-end agent flow.
category: multistep
steps:
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.hello
  - tool: set_material
    inputs:
      tag: bulk
      model: thermal
      properties:
        thermal_conductivity: 45.0
  - tool: set_bc
    inputs:
      tag: fixed
      type: dirichlet
      value: 300
  - tool: solve
    inputs:
      capability_id: solver.heat.linear
  - tool: query_field
    inputs:
      field: temperature
  - tool: export_results
    inputs:
      capability_id: writer.vtu
      path: /tmp/souxmar-eval-multistep-01.vtu
assertions:
  # Every step of the canonical agent flow has to succeed, not just the last.
  - kind: tool_outcome
    step: 0
    value: ok
  - kind: tool_outcome
    step: 3
    value: ok
  - kind: tool_outcome
    step: 4
    value: ok
  - kind: tool_outcome
    step: 5
    value: ok
  - kind: tool_data_equals
    path: capability_id
    value: writer.vtu
  - kind: tool_data_equals
    path: has_field
    value: true
