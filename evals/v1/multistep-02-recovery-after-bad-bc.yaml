id: multistep-02-recovery-after-bad-bc
description: After a refused BC, the next set_bc with a valid shape succeeds.
category: multistep
steps:
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.hello
  - tool: set_bc
    inputs:
      value: 42
  - tool: set_bc
    inputs:
      tag: fixed
      type: dirichlet
      value: 300
assertions:
  - kind: tool_outcome
    step: 1
    value: fail
  - kind: tool_error_code
    step: 1
    value: INVALID_ARGUMENT
  - kind: tool_outcome
    step: 2
    value: ok
