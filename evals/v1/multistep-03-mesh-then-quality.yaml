id: multistep-03-mesh-then-quality
description: Mesh -> query_mesh_quality returns the three per-cell metrics.
category: multistep
steps:
  # mesher.tetra.hello, not .grid: the grid mesher needs a geometry handle,
  # and this task is about the mesh -> quality hand-off, not about meshing.
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.hello
  - tool: query_mesh_quality
    inputs: {}
assertions:
  - kind: tool_outcome
    value: ok
  - kind: tool_data_present
    path: metrics.signed_volume
  - kind: tool_data_present
    path: metrics.edge_ratio
  - kind: tool_data_present
    path: metrics.min_dihedral_deg
  - kind: tool_data_gte
    path: num_cells
    value: 1
