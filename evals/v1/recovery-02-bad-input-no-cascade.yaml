id: recovery-02-bad-input-no-cascade
description: A bad input on one step doesn't poison the session state for the next.
category: recovery
steps:
  - tool: mesh
    inputs:
      capability_id: mesher.tetra.hello
  - tool: set_bc
    inputs: {}
  # query_mesh_quality still sees the mesh the first step staged: the failed
  # set_bc neither cleared the handle nor cascaded its error. (query_field
  # would be the tighter probe, but it legitimately needs a solve first, so
  # it cannot distinguish "session poisoned" from "no field yet".)
  - tool: query_mesh_quality
    inputs: {}
assertions:
  - kind: tool_outcome
    step: 0
    value: ok
  - kind: tool_outcome
    step: 1
    value: fail
  - kind: tool_error_code
    step: 1
    value: INVALID_ARGUMENT
  - kind: tool_outcome
    step: 2
    value: ok
