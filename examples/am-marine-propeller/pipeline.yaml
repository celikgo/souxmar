# SPDX-License-Identifier: Apache-2.0
#
# am-marine-propeller — printing a bronze propeller blade, and asking whether
# it will survive being a propeller. Drives six of the eighteen manufacturing
# capabilities (ADR-0044) plus the always-on OBJ reader and VTU writer:
#
#   reader.obj                                real lofted blade geometry
#     -> solver.am.distortion.inherent_strain deposition warp, layer by layer
#     -> solver.am.overhang                   downskin tilt + support need
#     -> solver.am.printability               composite DfAM score
#     -> solver.marine.corrosion              25-year seawater exposure
#          -> writer.vtu x2
#          -> writer.am.report                build report
#          -> writer.marine.qualification_report   advisory dossier
#
# What this models: one blade of a 0.6 m diameter nickel-aluminium-bronze
# (NAB, ~C95800) propeller for a small workboat, deposited root-down in +Z on
# a wire-arc (WAAM) cell at a 2 mm bead layer, then in seawater service for 25
# years. propeller-blade.obj is generated by generate-geometry.py in this
# directory — 672 nodes, 1340 Tri3 cells, watertight, 0.6 m diameter.
#
# THE OUTPUTS OF THIS PIPELINE ARE PRELIMINARY ENGINEERING ESTIMATES. Every
# model in the chain is closed-form or heuristic. Nothing here is a
# classification-society calculation and nothing here is class approval. See
# README.md § "Status of these numbers".
#
# Temperatures are degrees Celsius (souxmar's one documented exception to
# strict SI); everything else is SI.
#
# Run:
#   souxmar run examples/am-marine-propeller/pipeline.yaml \
#     --plugin-path build/dev/examples/plugins
#
# From the repository root, or from anywhere: this pipeline's input file
# is named relatively and resolves against this file's own directory.
# Outputs are written to the working directory you run from.
#
# Outputs in $PWD: propeller-distortion.vtu, propeller-overhang.vtu,
# propeller-build-report.md, propeller-qualification-dossier.md.

version: 1

stages:
  # ----------------------------------------------------------------- blade
  # Stage 1: read the blade.
  #
  # reader.obj fan-triangulates every quad into 2 Tri3 cells, so the 700 `f`
  # lines become 1340 cells on 672 nodes. The OBJ carries `g` group names
  # (blade_back / blade_face / blade_root / blade_tip) rather than `usemtl`
  # groups ON PURPOSE: obj-reader turns usemtl names into per-cell tags, and
  # every AM capability reads a non-negative cell tag as a layer index, so a
  # usemtl-tagged blade would be simulated as a four-layer part. Untagged
  # cells send the AM capabilities down their documented fallback — bin the
  # cell centroid along build_direction by layer_height — which is what we
  # want. `g` is ignored by the reader, so the groups survive for Blender and
  # MeshLab without polluting the tags.
  - id: blade
    plugin: reader.obj
    input:
      path: propeller-blade.obj

  # ------------------------------------------------------------ distortion
  # Stage 2: deposition distortion, inherent-strain method.
  #
  # NAB properties: E 120 GPa, nu 0.32, CTE 16.2e-6 /K, liquidus 1060 degC.
  # preheat_temperature is doing duty as the WAAM interpass temperature —
  # 150 degC, kept low deliberately because NAB coarsens and loses its
  # protective-film behaviour if you let the interpass run hot.
  #
  # The blade spans z = 0.081 .. 0.283 m, so a 2 mm layer height bins it into
  # about 100 deposition layers, and the field carries one step per layer:
  # scrub it to watch the tip walk sideways as the blade grows.
  #
  # strain_calibration 0.30 is NOT calibrated. The inherent-strain method is
  # a scaling law, and until you have fitted that number against a measured
  # blade off your own cell, read the magnitudes as relative, not absolute.
  - id: distortion
    plugin: solver.am.distortion.inherent_strain
    input:
      mesh: { from: blade }
      youngs_modulus: 1.2e11
      poisson_ratio: 0.32
      cte: 1.62e-5
      melt_temperature: 1060.0
      preheat_temperature: 150.0
      inherent_strain: 0.0
      strain_calibration: 0.30
      layer_height: 0.002
      substrate_thickness: 0.0
      build_direction: [0.0, 0.0, 1.0]
      baseplate_layers: 1
      baseplate_clamped: true
      num_layers: 0

  # -------------------------------------------------------------- overhang
  # Stage 3: downskin tilt and support need.
  #
  # Definitions, verbatim from the capability contract: for an outward unit
  # face normal n and unit build direction b, the face is downward iff
  # n.b < 0; its tilt from the build plate is acos(|n.b|) in degrees;
  # support_needed = 1 iff any downward boundary face of the cell tilts less
  # than overhang_threshold_deg.
  #
  # The result on this part is that root-down needs essentially no support:
  # no blade-surface facet falls below 45 deg (the shallowest is 64.9), and
  # the only flagged cells are the 18 on the root cap — which IS the
  # baseplate interface, something this capability cannot recognise as
  # supported. That is not luck: a propeller section lies on a cylinder of
  # radius r, so its surfaces are nearly parallel to the radial direction,
  # and the radial direction is the build direction when the blade stands on
  # its root. Flip build_direction to [0,0,-1], [0,1,0] or [1,0,0] and re-run
  # to see the orientation study in README.md.
  #
  # 45 deg is the conventional self-supporting limit for arc deposition. It
  # is a convention, not a physical constant — a well-tuned cell manages 30,
  # a badly tuned one struggles at 50.
  - id: overhang
    plugin: solver.am.overhang
    input:
      mesh: { from: blade }
      build_direction: [0.0, 0.0, 1.0]
      overhang_threshold_deg: 45.0
      layer_height: 0.002

  # ----------------------------------------------------------- printability
  # Stage 4: composite DfAM printability score.
  #
  # READ THIS BEFORE READING THE FIELD: on a Tri3 SURFACE mesh the
  # wall-thickness proxy is 0 — the proxy is 2*V_cell/A_boundary and a surface
  # mesh carries no volume — so the plugin SKIPS the thin-wall and
  # corrosion-allowance penalties entirely. min_wall_thickness (4 mm, one WAAM
  # bead width) and corrosion_allowance (1 mm sacrificial thickness) are
  # therefore declared here for the record and have no effect on this field.
  # They document the process intent, they appear in the report, and they
  # start mattering the moment a volume mesh goes through this stage.
  #
  # What is left live is the overhang term (which is ~0 here, see stage 3),
  # the global aspect term (slenderness 2.6 against an 8:1 rule, so 0) and the
  # hard build-volume gate (the blade's 0.078 x 0.183 x 0.202 m envelope fits
  # inside the 0.6 m robotic cell). Expect a score at or near 1.0 with
  # limiting_factor_code 0 almost everywhere — and note that the score cannot
  # see that the blade tip is only 2.4 mm thick against a 4-6 mm bead, which
  # is the real reason WAAM blades are deposited oversize and machined back.
  - id: printability
    plugin: solver.am.printability
    input:
      mesh: { from: blade }
      build_direction: [0.0, 0.0, 1.0]
      overhang_threshold_deg: 45.0
      min_wall_thickness: 0.004
      machine_build_volume: [0.6, 0.6, 0.6]
      corrosion_allowance: 0.001
      layer_height: 0.002

  # ------------------------------------------------------------- corrosion
  # Stage 5: seawater corrosion, galvanic coupling and pitting risk.
  #
  # NAB is the standard propeller alloy because it forms a protective
  # aluminium/copper oxide film and resists cavitation erosion. It is also
  # less noble than the passive stainless shaft it bolts to, so the blade is
  # the anode in that couple — which is fine here because the cathode is
  # small (area_ratio_cathode_anode 0.15) and the shaft is bonded into the
  # hull's cathodic-protection system through an earthing brush
  # (cathodic_protection: true).
  #
  # flow_velocity 8 m/s is the representative relative flow over the section,
  # not the free-stream ship speed. NAB tolerates that; a 90-10 copper-nickel
  # in the same place would erode.
  #
  # PREN is meaningless for a bronze (no chromium), so the composition inputs
  # are left to the alloy table and the pitting sub-score should be read as
  # "selective phase attack risk", not as chloride pitting.
  - id: corrosion
    plugin: solver.marine.corrosion
    input:
      mesh: { from: blade }
      alloy: NAB
      mating_alloy: "316L"
      area_ratio_cathode_anode: 0.15
      seawater_temperature: 12.0
      salinity_psu: 35.0
      flow_velocity: 8.0
      oxygen_mg_per_l: 8.0
      service_life_years: 25.0
      cathodic_protection: true
      coating_efficiency: 0.0
      as_built_surface: true

  # ---------------------------------------------------------------- output
  # Stage 6: nodal displacement vectors, metres, ~100 steps. Warp by vector
  # with a big scale factor in ParaView.
  - id: write-distortion
    plugin: writer.vtu
    input:
      mesh:  { from: blade }
      field: { from: distortion }
      path:  propeller-distortion.vtu

  # Stage 7: per-cell overhang triple: [0] min downskin tilt (deg, 90 = no
  # downward face), [1] support needed (0/1), [2] downskin area (m^2).
  # Threshold-colour component 1 to get a support map.
  - id: write-overhang
    plugin: writer.vtu
    input:
      mesh:  { from: blade }
      field: { from: overhang }
      path:  propeller-overhang.vtu

  # Stage 8: the build report, rendered around the printability field.
  #
  # `laser_power` is the contract's name for the process heat-source power;
  # for a WAAM cell read it as arc power (3 kW). deposition_rate is what
  # actually sets the build time for a wire process, and process_layer_height
  # equals layer_height because a deposition bead IS the simulation layer —
  # no coarsening here, unlike the LPBF example.
  - id: report
    plugin: writer.am.report
    input:
      mesh:  { from: blade }
      field: { from: printability }
      path:  propeller-build-report.md
      title: "NAB propeller blade — WAAM build report"
      process: ded_waam
      material: "NAB"
      design_notes: >-
        One blade of a 0.6 m diameter propeller, deposited root-down, which the
        overhang check confirms is a self-supporting orientation. The
        as-deposited blade is oversize and machined to the hydrodynamic surface
        afterwards, and neither that allowance nor the 2.4 mm finished tip
        thickness is visible to this pipeline: the geometry is a surface mesh,
        so the wall-thickness proxy is 0 and the thin-wall penalty is skipped.
        strain_calibration is uncalibrated at 0.30.
      layer_height: 0.002
      process_layer_height: 0.002
      deposition_rate: 3.0
      laser_power: 3000.0
      machine_power_overhead: 6000.0
      material_cost_per_kg: 30.0
      machine_rate_per_hour: 85.0
      density: 7600.0
      build_direction: [0.0, 0.0, 1.0]

  # Stage 9: the advisory qualification dossier, rendered around the
  # corrosion field.
  #
  # criticality 1 is the top of the writer's 1..3 scale: losing a blade is a
  # loss-of-propulsion event on a single-screw vessel, hence redundancy:
  # false. class_framework stays "generic" — putting a class rule number
  # there changes the wording and changes nothing about the disclaimer.
  # souxmar is not a classification society and this file is not approval.
  - id: dossier
    plugin: writer.marine.qualification_report
    input:
      mesh:  { from: blade }
      field: { from: corrosion }
      path:  propeller-qualification-dossier.md
      part_name: "NAB propeller blade, 0.6 m dia, 1 of 4"
      process: ded_waam
      alloy: "NAB"
      application: propulsion
      criticality: 1
      design_depth: 50.0
      service_life_years: 25.0
      class_framework: generic
      redundancy: false
