# SPDX-License-Identifier: Apache-2.0
#
# am-polymer-auv-fairing — the polymer half of the manufacturing block. Drives
# six of the eighteen capabilities (ADR-0044) on a real shell:
#
#   reader.obj                        thin-walled nose fairing
#     -> solver.am.polymer.fff        interlayer thermal cycling
#        -> postproc.am.bond_strength degree of healing / Z-strength
#     -> solver.am.printability       composite DfAM score
#     -> solver.am.buildtime          per-layer time, energy, mass, cost
#          -> writer.am.gcode         printable FFF G-code
#          -> writer.vtu x2
#          -> writer.am.report        build report
#
# What this models: the nose fairing of a 0.2 m diameter AUV, printed nose-up
# in PEKK on a heated-chamber FFF machine at a 0.4 mm layer with a 0.6 mm
# nozzle. 0.294 m tall, 3 mm wall, 735 layers. The physics of interest is
# interlayer bonding: an FFF part is only as strong in Z as the weld between
# roads, and that weld is set by how hot the interface still is when the next
# road lands. fairing.obj is generated by generate-geometry.py in this
# directory — 936 nodes, 1872 Tri3 cells, watertight.
#
# THE OUTPUTS OF THIS PIPELINE ARE PRELIMINARY ENGINEERING ESTIMATES.
# The reptation reference pair below is a placeholder, NOT a PEKK measurement
# — see the comment on the `bond` stage. The subsea note in README.md applies:
# nothing here is class approval.
#
# Temperatures are degrees Celsius; everything else is SI.
#
# Run:
#   souxmar run examples/am-polymer-auv-fairing/pipeline.yaml \
#     --plugin-path build/dev/examples/plugins
#
# From the repository root, or from anywhere: this pipeline's input file
# is named relatively and resolves against this file's own directory.
# Outputs are written to the working directory you run from.
#
# Outputs in $PWD: fairing.gcode, fairing-printability.vtu,
# fairing-buildtime.vtu, fairing-build-report.md.

version: 1

stages:
  # --------------------------------------------------------------- fairing
  # Stage 1: read the shell. `g` groups, not `usemtl` — the OBJ header
  # explains why (a usemtl tag would be read as a layer index by every AM
  # capability, turning 735 print layers into 4).
  - id: fairing
    plugin: reader.obj
    input:
      path: fairing.obj

  # ------------------------------------------------------------------- fff
  # Stage 2: interlayer thermal cycling.
  #
  # PEKK on a heated-chamber machine: 380 degC nozzle, 140 degC bed, 120 degC
  # chamber, Tg 162 degC. The chamber temperature is the whole reason a
  # machine like this exists — it is what keeps the interface above Tg long
  # enough to weld, and it is why PEKK printed in an open-air machine
  # delaminates.
  #
  # Lumped-capacitance cooling: T(t) = T_env + (T_dep - T_env) exp(-t/tau),
  # tau = rho*c*V/(h*A) with the characteristic length taken from
  # layer_height / road_width. The interface temperature when the next road
  # lands is the mean of the fresh road and the substrate.
  #
  # layer_time 45 s is the constant this model takes: about 1.3 m of
  # perimeter plus infill at 30 mm/s near the base. The real per-layer time
  # falls towards the nose as the cross-section shrinks, which the constant
  # cannot represent — so the nose's bond quality is UNDER-estimated here
  # (less dwell in reality means a hotter interface). solver.am.buildtime,
  # stage 5, computes the real per-layer time; compare them.
  - id: fff
    plugin: solver.am.polymer.fff
    input:
      mesh: { from: fairing }
      nozzle_temperature: 380.0
      bed_temperature: 140.0
      chamber_temperature: 120.0
      layer_time: 45.0
      layer_height: 4.0e-4
      road_width: 6.0e-4
      convection_coefficient: 20.0
      density: 1300.0
      specific_heat: 1900.0
      thermal_conductivity: 0.25
      glass_transition_temperature: 162.0
      build_direction: [0.0, 0.0, 1.0]
      baseplate_layers: 1
      num_layers: 0

  # ------------------------------------------------------------------ bond
  # Stage 3: degree of healing and Z-strength fraction.
  #
  # Reptation healing: D_h = min(1, (t_weld/t_rep)^0.25), with t_rep shifted
  # by an Arrhenius factor in the interface temperature. The 1/4 exponent is
  # Wool & O'Connor's welding law as applied to FDM by Yang & Pitchumani
  # (2002).
  #
  # BE HONEST ABOUT THIS: reptation_time_reference = 2.0 s at
  # reptation_reference_temperature = 340 degC is a PLACEHOLDER. It is not a
  # PEKK rheology measurement; it is a pair chosen so the Arrhenius shift
  # lands in a plausible range for a 380 degC nozzle, and the contract's own
  # default (2.0 s at 260 degC) is worse for PEKK because PEKK is not even
  # molten at 260 degC. Activation energy 80 kJ/mol is the right order for a
  # PEKK-family melt and no more than that. Fit both against short-beam or
  # tensile-Z coupons before you quote a Z-strength number to anyone.
  - id: bond
    plugin: postproc.am.bond_strength
    input:
      mesh:  { from: fairing }
      field: { from: fff }
      glass_transition_temperature: 162.0
      reptation_time_reference: 2.0
      reptation_reference_temperature: 340.0
      activation_energy: 8.0e4
      layer_time: 45.0

  # ----------------------------------------------------------- printability
  # Stage 4: composite DfAM score.
  #
  # min_wall_thickness 1.2 mm is two 0.6 mm roads — the thinnest wall this
  # nozzle can actually build. The fairing's 3 mm wall clears that by 2.5x,
  # so the score should be driven by the overhang term instead: the outer
  # skin's tilt from the build plate falls from 90 deg at the base flange to
  # about 38 deg at the nose, so the tip facets breach the 45 deg threshold
  # and the nose region should come back with limiting_factor_code 1.
  #
  # machine_build_volume 300 x 300 x 400 mm is a mid-size heated-chamber
  # machine; the part fits with room to spare. corrosion_allowance is 0
  # because a thermoplastic in seawater does not corrode — it creeps and it
  # absorbs water, neither of which this capability models.
  - id: printability
    plugin: solver.am.printability
    input:
      mesh: { from: fairing }
      build_direction: [0.0, 0.0, 1.0]
      overhang_threshold_deg: 45.0
      min_wall_thickness: 0.0012
      machine_build_volume: [0.3, 0.3, 0.4]
      corrosion_allowance: 0.0
      layer_height: 4.0e-4

  # ------------------------------------------------------------- buildtime
  # Stage 5: per-layer time, energy, mass and cost.
  #
  # process: fff selects the extrusion branch, where the layer time comes
  # from layer area / (road_width * print_speed) rather than from a hatch and
  # a scan speed. process_layer_height equals layer_height because in FFF the
  # machine layer IS the simulation layer — no coarsening, unlike the LPBF
  # example.
  #
  # `laser_power` is the contract's name for process heat-source power; an
  # FFF hot end draws 40-60 W, so 60 W it is, with the chamber, bed and
  # motion system in machine_power_overhead. material_cost_per_kg 700 is an
  # indicative PEKK filament price and it is the number most likely to be
  # wrong for you by a factor of two — get a quote.
  #
  # For a SURFACE mesh like this one, per-layer area is the |n.b|-weighted
  # projected triangle area, not a solid cross-section: the number is the
  # area of the shell's footprint in that layer, which for a 3 mm wall is
  # small. Read the totals as a lower bound.
  - id: buildtime
    plugin: solver.am.buildtime
    input:
      mesh: { from: fairing }
      process: fff
      layer_height: 4.0e-4
      process_layer_height: 4.0e-4
      print_speed: 0.03
      road_width: 6.0e-4
      laser_power: 60.0
      machine_power_overhead: 1200.0
      material_cost_per_kg: 700.0
      machine_rate_per_hour: 25.0
      density: 1300.0
      build_direction: [0.0, 0.0, 1.0]

  # ---------------------------------------------------------------- output
  # Stage 6: G-code.
  #
  # READ THE G-CODE BEFORE YOU RUN IT. This is a demonstration slicer, not
  # PrusaSlicer: single perimeter per contour, no offset compensation for
  # nozzle width, no support generation, no bridging logic, no cooling-fan
  # control, no start/end script for your machine. It emits a `;` header of
  # every parameter, M104/M140/G28/G90/M82, then per layer a G1 Z move, one
  # perimeter pass per closed contour and alternating +/-45 deg scanline
  # infill, with E computed from extruded volume over filament
  # cross-section. Feed it to a machine unsupervised and you will crash the
  # nozzle.
  #
  # 0.294 m at a 0.4 mm layer is 735 layers, well inside max_layers.
  - id: gcode
    plugin: writer.am.gcode
    input:
      mesh:  { from: fairing }
      path:  fairing.gcode
      layer_height: 4.0e-4
      road_width: 6.0e-4
      filament_diameter: 1.75e-3
      nozzle_temperature: 380.0
      bed_temperature: 140.0
      print_speed: 0.03
      travel_speed: 0.12
      infill_spacing: 0.002
      infill_angle_deg: 45.0
      retract_length: 0.001
      flow_multiplier: 1.0
      build_direction: [0.0, 0.0, 1.0]
      max_layers: 5000

  # Stage 7: per-cell printability triple: [0] score (0..1, 1 = trivially
  # printable), [1] limiting factor code (0 none, 1 overhang, 2 thin wall,
  # 3 build-volume fit, 4 aspect ratio, 5 corrosion allowance), [2] wall
  # thickness proxy (m). Colour by component 1 with a categorical map.
  - id: write-printability
    plugin: writer.vtu
    input:
      mesh:  { from: fairing }
      field: { from: printability }
      path:  fairing-printability.vtu

  # Stage 8: per-cell buildtime triple: [0] this cell's layer time (s),
  # [1] cumulative time to the end of this cell's layer (s), [2] layer area
  # (m^2). Colour by component 1 to see where the build hours go.
  - id: write-buildtime
    plugin: writer.vtu
    input:
      mesh:  { from: fairing }
      field: { from: buildtime }
      path:  fairing-buildtime.vtu

  # Stage 9: the build report, rendered around the bond-quality field —
  # degree of healing, Z-strength fraction and seconds above Tg per cell,
  # which is the number that decides whether this part is worth printing.
  - id: report
    plugin: writer.am.report
    input:
      mesh:  { from: fairing }
      field: { from: bond }
      path:  fairing-build-report.md
      title: "PEKK AUV nose fairing — build report"
      process: fff
      material: "PEKK"
      design_notes: >-
        Printed nose-up, base flange on the bed. Bond quality is computed from
        a placeholder reptation reference pair (2.0 s at 340 degC) and a
        constant 45 s layer time; both need fitting before the Z-strength
        fraction means anything. PA12-CF is the cheaper substitute for this
        part and is in examples/materials/am-marine.toml with its own process
        window.
      layer_height: 4.0e-4
      process_layer_height: 4.0e-4
      print_speed: 0.03
      road_width: 6.0e-4
      laser_power: 60.0
      machine_power_overhead: 1200.0
      material_cost_per_kg: 700.0
      machine_rate_per_hour: 25.0
      density: 1300.0
      build_direction: [0.0, 0.0, 1.0]
