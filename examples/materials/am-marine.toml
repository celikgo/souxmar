# SPDX-License-Identifier: Apache-2.0
#
# am-marine.toml — curated AM feedstocks for marine and subsea service.
#
# ============================================================================
# THESE ARE REFERENCE VALUES FOR SETTING UP AN ANALYSIS. THEY ARE NOT DESIGN
# ALLOWABLES.
#
# Every number below is a rounded, indicative value for a material FAMILY, not
# a certified property of the powder or wire in your hopper. Additively
# manufactured properties depend on the machine, the parameter set, the build
# orientation, the atmosphere, the powder lot, the thermal history and the
# post-processing — a 316L coupon printed on two machines with the same
# nominal recipe can differ by 15% in yield and by a factor of two in
# elongation. Use these numbers to get a pipeline running and to see whether
# an idea is in the right order of magnitude. Then replace every one of them
# with values from your own qualified coupons before anything gets built,
# quoted, or signed off.
#
# No souxmar plugin reads this file. By design: every material property in the
# manufacturing block is an explicit pipeline input with a documented default
# (ADR-0044), so a pipeline is self-describing and nothing depends on a
# material database being present or on which version of it you have. This
# file is a copy-paste source for humans and the seed table for the
# `propose_am_setup` agent tool.
# ============================================================================
#
# Conventions
# -----------
# * Strict SI, with souxmar's single documented exception: temperatures are
#   degrees Celsius, here and in every YAML key and output field.
# * Keys that share a name with a pipeline input key hold the same quantity in
#   the same unit, so they paste straight into a stage's `input:` block. That
#   covers density, youngs_modulus, poisson_ratio, yield_strength, cte,
#   thermal_conductivity, specific_heat, melt_temperature,
#   glass_transition_temperature, laser_power, scan_speed, hatch_spacing,
#   process_layer_height, absorptivity, nozzle_temperature, bed_temperature,
#   chamber_temperature, print_speed, road_width, material_cost_per_kg,
#   am_anisotropy_knockdown, chromium_pct, molybdenum_pct and nitrogen_pct.
# * `yield_strength` and `ultimate_strength` are AS-BUILT, measured IN-LAYER
#   (XY). The `[*.anisotropy]` table gives the build-direction (Z) ratios.
#   Heat treatment moves both, usually a long way — see each material's notes.
# * Every material carries a `source` string. Where a number cannot be
#   attributed to a standard or a datasheet family, the source says
#   "indicative" and the number is rounded hard so nobody mistakes it for a
#   measurement.
# * PREN = %Cr + 3.3*%Mo + 16*%N. It is defined for stainless steels. Where it
#   is meaningless (bronzes, titanium, aluminium, copper-nickel) the key is
#   absent and `pren_applicable = false`.

[library]
name = "souxmar AM + marine reference materials"
version = "1"
status = "reference values for analysis set-up — NOT design allowables"
temperature_unit = "degC"
other_units = "strict SI (m, kg, s, W, Pa, J, N)"
property_basis = "as-built, in-layer (XY) unless a note says otherwise"
disclaimer = """
Indicative material-family values, rounded. Not certified properties, not
design allowables, not a substitute for coupon testing. souxmar is not a
classification society and this file confers no approval of any kind.
"""

# ############################################################################
# METALS
# ############################################################################

# ---------------------------------------------------------------------------
# 316L — the default. Cheap, weldable, prints without drama, and the alloy
# every AM machine is characterised on. Its weakness is exactly the one that
# matters at sea: 316L pits and crevice-corrodes in stagnant chloride, so it
# belongs in flowing seawater with cathodic protection, or in dry spaces, and
# not in a stagnant flooded void with a 25-year life.
# ---------------------------------------------------------------------------
[metals."316L"]
name = "316L austenitic stainless steel"
family = "austenitic stainless steel"
processes = ["lpbf", "ded_waam", "binder_jet"]
density = 7990.0                  # kg/m^3
youngs_modulus = 1.90e11          # Pa
poisson_ratio = 0.28              # -
yield_strength = 5.0e8            # Pa, as-built XY
ultimate_strength = 6.4e8         # Pa, as-built XY
cte = 1.60e-5                     # 1/K, 20-100 degC
thermal_conductivity = 15.0       # W/(m K), as-built, 20 degC
specific_heat = 500.0             # J/(kg K)
melt_temperature = 1400.0         # degC, liquidus (solidus ~1375)
material_cost_per_kg = 75.0       # indicative gas-atomised powder, per kg
source = """
Wrought baseline: ASTM A240 / AISI 316L (E = 193 GPa, YS min 205 MPa).
AM values indicative of published LPBF as-built ranges (YS 450-590 MPa,
UTS 550-700 MPa), rounded. Thermophysical values are wrought handbook
figures; as-built conductivity is lower than wrought because of porosity
and the cellular structure.
"""
notes = """
As-built LPBF 316L is STRONGER and much less ductile than wrought 316L: the
cellular solidification structure gives 450-590 MPa yield against a wrought
minimum of 205. A solution anneal removes that advantage. Do not use a
wrought yield allowable for an as-built part or a printed-part yield for an
annealed one.
"""

[metals."316L".process_window]
process = "lpbf"
laser_power = 195.0               # W
scan_speed = 0.8                  # m/s
hatch_spacing = 1.1e-4            # m
process_layer_height = 3.0e-5     # m
absorptivity = 0.35               # -
preheat_temperature = 80.0        # degC, baseplate
volumetric_energy_density = 73.9  # J/mm^3 = P / (v * h * t)
source = "indicative parameter set for a 400 W class machine; not a machine-qualified recipe"

[metals."316L".anisotropy]
yield_z_over_xy = 0.95
ultimate_z_over_xy = 0.92
elongation_z_over_xy = 0.75
am_anisotropy_knockdown = 0.95    # -> solver.marine.hull_collapse
source = "indicative; as-built LPBF, Z vs XY. Anisotropy largely disappears after HIP."

[metals."316L".corrosion]
chromium_pct = 17.0
molybdenum_pct = 2.5
nitrogen_pct = 0.05
pren = 26.1
pren_applicable = true
seawater_note = """
Marginal for permanent seawater immersion. Pits and crevice-corrodes in
stagnant or low-flow chloride, especially at as-built surface roughness and
around unfused porosity. Acceptable in flowing seawater with cathodic
protection; not acceptable in a stagnant flooded void without one. As-built
surfaces should be assumed worse than machined ones.
"""
source = "composition: typical mid-range 316L. PREN by definition. Seawater behaviour: standard practice, indicative."

# ---------------------------------------------------------------------------
# 2507 super duplex — what you use when 316L will not survive the water.
# Twice the yield and a PREN in the forties. The catch is specific to AM: the
# duplex ferrite/austenite balance is a HEAT-TREATMENT product, and an
# as-built LPBF duplex is almost fully ferritic with poor toughness. It is not
# duplex until it has been solution annealed.
# ---------------------------------------------------------------------------
[metals."2507"]
name = "UNS S32750 / 2507 super duplex stainless steel"
family = "duplex stainless steel"
processes = ["lpbf", "ded_waam"]
density = 7800.0                  # kg/m^3
youngs_modulus = 2.00e11          # Pa
poisson_ratio = 0.30              # -
yield_strength = 5.5e8            # Pa, solution-annealed (wrought minimum)
ultimate_strength = 8.0e8         # Pa, solution-annealed
cte = 1.30e-5                     # 1/K, 20-100 degC
thermal_conductivity = 15.0       # W/(m K), 20 degC
specific_heat = 480.0             # J/(kg K)
melt_temperature = 1400.0         # degC, liquidus (indicative)
material_cost_per_kg = 110.0      # indicative powder, per kg
source = """
ASTM A240 / A790 UNS S32750 minima (0.2% YS >= 550 MPa, UTS >= 795 MPa) for
the solution-annealed condition. Thermophysical values are wrought figures.
AM process window indicative.
"""
notes = """
AS-BUILT LPBF DUPLEX IS NOT DUPLEX. Rapid solidification suppresses austenite
formation, so the as-built structure is 90%+ ferrite with low impact toughness
and degraded corrosion performance. A solution anneal (roughly 1050-1100 degC,
water quench) restores the phase balance. Any as-built property you assume
here is optimistic; the yield above is the annealed wrought minimum and should
only be used for a post-heat-treated part.
"""

[metals."2507".process_window]
process = "lpbf"
laser_power = 250.0               # W
scan_speed = 0.7                  # m/s
hatch_spacing = 1.1e-4            # m
process_layer_height = 3.0e-5     # m
absorptivity = 0.35               # -
preheat_temperature = 100.0       # degC, baseplate
volumetric_energy_density = 108.2 # J/mm^3
source = "indicative; higher energy density than 316L to limit lack-of-fusion in a higher-Cr melt"

[metals."2507".anisotropy]
yield_z_over_xy = 0.90
ultimate_z_over_xy = 0.90
elongation_z_over_xy = 0.60
am_anisotropy_knockdown = 0.90
source = "indicative; as-built columnar ferrite is strongly textured. Annealing reduces the gap."

[metals."2507".corrosion]
chromium_pct = 25.0
molybdenum_pct = 4.0
nitrogen_pct = 0.27
pren = 42.5
pren_applicable = true
seawater_note = """
Excellent chloride pitting and crevice resistance in the annealed condition —
a PREN in the forties is the usual threshold for permanent seawater immersion.
Watch two things: nitrogen loss during printing in an argon atmosphere drops
the effective PREN, and the as-built ferritic structure does not deliver the
annealed alloy's resistance. Susceptible to hydrogen embrittlement under
over-protective cathodic protection.
"""
source = "composition: mid-range S32750 per ASTM A240. PREN by definition. Seawater behaviour: standard practice."

# ---------------------------------------------------------------------------
# NAB — nickel-aluminium bronze. The propeller alloy: it holds a protective
# film in fast seawater, resists cavitation erosion better than any stainless,
# and has been cast into propellers for a century. Wire-arc deposition is the
# realistic AM route; powder-bed struggles with its reflectivity and thermal
# conductivity.
# ---------------------------------------------------------------------------
[metals."NAB"]
name = "Nickel-aluminium bronze (C95800 / CU3)"
family = "aluminium bronze"
processes = ["ded_waam", "lpbf"]
density = 7600.0                  # kg/m^3
youngs_modulus = 1.20e11          # Pa
poisson_ratio = 0.32              # -
yield_strength = 2.4e8            # Pa, cast minimum
ultimate_strength = 5.9e8         # Pa, cast minimum
cte = 1.62e-5                     # 1/K, 20-100 degC
thermal_conductivity = 42.0       # W/(m K), 20 degC
specific_heat = 420.0             # J/(kg K)
melt_temperature = 1060.0         # degC, liquidus (solidus ~1040)
material_cost_per_kg = 30.0       # indicative WAAM wire, per kg (powder is ~3x)
source = """
ASTM B148 C95800 cast minima (UTS >= 585 MPa, 0.2% YS >= 240 MPa, elongation
>= 15%). Thermophysical values are C95800 handbook figures. WAAM properties
indicative: published wire-arc NAB falls in YS 250-330 MPa, UTS 600-700 MPa,
i.e. at or above the cast minima.
"""
notes = """
High thermal conductivity (42 W/m K, nearly 3x 316L) and high reflectivity at
1 um make NAB hard to print on a powder-bed machine: you need much more power
for the same melt pool, and the process window is narrow. Wire-arc / CMT
deposition is the route used for real large bronze parts. As-deposited NAB
contains a coarse kappa-phase distribution that is susceptible to selective
phase attack in seawater; a temper anneal (roughly 675 degC) is standard
practice for cast NAB and should be assumed necessary for the printed alloy
too.
"""

[metals."NAB".process_window]
process = "ded_waam"
deposition_rate = 3.0             # kg/h
arc_power = 3000.0                # W (pipeline key: laser_power, see notes)
travel_speed = 0.008              # m/s, torch travel
bead_layer_height = 0.002         # m (pipeline key: layer_height)
interpass_temperature_max = 200.0 # degC — keep it low or the kappa phase coarsens
source = "indicative wire-arc parameters for a bronze; not a qualified procedure"

[metals."NAB".anisotropy]
yield_z_over_xy = 0.90
ultimate_z_over_xy = 0.92
elongation_z_over_xy = 0.80
am_anisotropy_knockdown = 0.90
source = "indicative; wire-arc NAB shows modest anisotropy from columnar growth across deposition layers"

[metals."NAB".corrosion]
pren_applicable = false
seawater_note = """
The reference alloy for seawater service in motion: protective aluminium/
copper oxide film, excellent cavitation-erosion and impingement resistance,
inherent biofouling resistance from copper ion release. Less noble than
passive stainless steel, so a NAB blade coupled to a stainless shaft is the
anode — keep the cathode area small and bond the shaft into the cathodic-
protection system. Two specific vulnerabilities: selective phase attack of
the kappa phase in as-cast/as-deposited material, and stress-corrosion
cracking in ammonia. PREN does not apply: there is no chromium.
"""
source = "standard marine engineering practice for C95800; indicative, no rate quoted"

# ---------------------------------------------------------------------------
# Ti-6Al-4V — immune to seawater, half the density of steel, and the best
# characterised AM alloy in existence because aerospace paid for it. Two
# reasons to think twice: it is expensive, and it is so noble that it will
# quietly eat any steel or aluminium it is bolted to.
# ---------------------------------------------------------------------------
[metals."Ti-6Al-4V"]
name = "Ti-6Al-4V (Grade 5) titanium alloy"
family = "alpha-beta titanium alloy"
processes = ["lpbf", "ebm", "ded_waam"]
density = 4430.0                  # kg/m^3
youngs_modulus = 1.13e11          # Pa
poisson_ratio = 0.34              # -
yield_strength = 9.0e8            # Pa, as-built PBF
ultimate_strength = 1.00e9        # Pa, as-built PBF
cte = 8.70e-6                     # 1/K, 20-100 degC
thermal_conductivity = 7.0        # W/(m K), 20 degC
specific_heat = 560.0             # J/(kg K)
melt_temperature = 1650.0         # degC, liquidus (solidus ~1600)
material_cost_per_kg = 250.0      # indicative plasma/gas-atomised powder, per kg
source = """
ASTM F2924 (PBF Ti-6Al-4V) minima: 0.2% YS >= 825 MPa, UTS >= 895 MPa.
Values above are rounded typical as-built results, which sit above those
minima. Thermophysical values are Grade 5 wrought handbook figures.
"""
notes = """
Low thermal conductivity (7 W/m K) concentrates heat in the melt pool, so
Ti-6Al-4V builds high residual stress and distorts more than 316L for the
same geometry — the inherent-strain example is worth running before
committing a tall part. Oxygen pickup embrittles it: control the build
atmosphere and do not recycle powder indefinitely. As-built parts carry a
fatigue penalty from surface roughness and sub-surface porosity that HIP plus
machining largely removes.
"""

[metals."Ti-6Al-4V".process_window]
process = "lpbf"
laser_power = 280.0               # W
scan_speed = 1.2                  # m/s
hatch_spacing = 1.4e-4            # m
process_layer_height = 3.0e-5     # m
absorptivity = 0.40               # -
preheat_temperature = 100.0       # degC, baseplate
volumetric_energy_density = 55.6  # J/mm^3
source = "indicative parameter set for a 400 W class machine; not a machine-qualified recipe"

[metals."Ti-6Al-4V".anisotropy]
yield_z_over_xy = 0.95
ultimate_z_over_xy = 0.95
elongation_z_over_xy = 0.70
am_anisotropy_knockdown = 0.95
source = "indicative; columnar prior-beta grains give modest strength anisotropy and larger ductility anisotropy"

[metals."Ti-6Al-4V".corrosion]
pren_applicable = false
seawater_note = """
Effectively immune to seawater corrosion at ambient temperature: the TiO2 film
is stable in chloride and crevice corrosion is not a practical concern below
about 70 degC. The risk is the other way round — titanium is strongly cathodic
in seawater, so it will drive galvanic attack on any steel, aluminium or
bronze it contacts. Isolate the joint or accept that the other metal is the
anode. Also avoid galling contact with aluminium alloys and be aware of
hydrogen pickup under heavy cathodic protection.
"""
source = "standard marine practice for Grade 5 titanium; indicative"

# ---------------------------------------------------------------------------
# IN625 — nickel superalloy for the subsea jobs that are hot, highly stressed
# and in seawater at the same time: valve internals, connectors, choke trim.
# Excellent crevice resistance, prints well, expensive.
# ---------------------------------------------------------------------------
[metals."IN625"]
name = "Inconel 625 / Alloy 625 (UNS N06625)"
family = "nickel-chromium-molybdenum superalloy"
processes = ["lpbf", "ded_waam"]
density = 8440.0                  # kg/m^3
youngs_modulus = 2.05e11          # Pa
poisson_ratio = 0.31              # -
yield_strength = 6.0e8            # Pa, as-built LPBF
ultimate_strength = 9.0e8         # Pa, as-built LPBF
cte = 1.28e-5                     # 1/K, 20-100 degC
thermal_conductivity = 10.0       # W/(m K), 20 degC
specific_heat = 410.0             # J/(kg K)
melt_temperature = 1350.0         # degC, liquidus (solidus ~1290)
material_cost_per_kg = 120.0      # indicative powder, per kg
source = """
Wrought baseline: AMS 5666 / AMS 5599 Alloy 625, annealed (YS min ~275 MPa).
As-built LPBF values above are rounded typicals from the published range
(YS 550-720 MPa, UTS 830-1000 MPa), which the fine cellular structure puts
well above the annealed wrought minimum. Thermophysical values are wrought
handbook figures.
"""
notes = """
The as-built strength advantage is a solidification-structure artefact and a
stress relief at ~870 degC will drop the yield towards 450 MPa. A full
solution anneal drops it further. Decide which condition you are designing
for before picking a number. IN625 is also prone to Laves-phase segregation in
as-built material, which matters for ductility and for hot-corrosion
resistance.
"""

[metals."IN625".process_window]
process = "lpbf"
laser_power = 285.0               # W
scan_speed = 0.96                 # m/s
hatch_spacing = 1.1e-4            # m
process_layer_height = 4.0e-5     # m
absorptivity = 0.38               # -
preheat_temperature = 80.0        # degC, baseplate
volumetric_energy_density = 67.5  # J/mm^3
source = "indicative parameter set for a 400 W class machine; not a machine-qualified recipe"

[metals."IN625".anisotropy]
yield_z_over_xy = 0.90
ultimate_z_over_xy = 0.92
elongation_z_over_xy = 0.75
am_anisotropy_knockdown = 0.90
source = "indicative; as-built LPBF, Z vs XY"

[metals."IN625".corrosion]
chromium_pct = 21.5
molybdenum_pct = 9.0
nitrogen_pct = 0.0
pren = 51.2
pren_applicable = false
seawater_note = """
Outstanding seawater pitting and crevice resistance, and it holds up in
oxygenated hot chloride where duplex stainless does not — which is why it
appears in subsea valve and connector trim. The PREN figure above is computed
from the composition for comparison only: PREN is defined for stainless
steels, and applying it to a nickel-base alloy is an indicative ranking, not a
criterion. Hence pren_applicable = false despite the number being present.
"""
source = "composition: mid-range N06625. Seawater behaviour: standard subsea practice, indicative."

# ---------------------------------------------------------------------------
# AlSi10Mg — light, cheap, fast to print, thermally conductive. Also the worst
# choice on this list for anything permanently wet: it is anodic to every
# other metal here and it pits in chloride. Use it for dry-space brackets,
# heat sinks and prototypes.
# ---------------------------------------------------------------------------
[metals."AlSi10Mg"]
name = "AlSi10Mg cast aluminium alloy"
family = "aluminium-silicon casting alloy"
processes = ["lpbf"]
density = 2670.0                  # kg/m^3
youngs_modulus = 7.0e10           # Pa
poisson_ratio = 0.33              # -
yield_strength = 2.4e8            # Pa, as-built
ultimate_strength = 4.0e8         # Pa, as-built
cte = 2.10e-5                     # 1/K, 20-100 degC
thermal_conductivity = 120.0      # W/(m K), as-built
specific_heat = 900.0             # J/(kg K)
melt_temperature = 590.0          # degC, liquidus (solidus ~557)
material_cost_per_kg = 70.0       # indicative powder, per kg
source = """
Cast baseline: EN AC-43000 / A360-family AlSi10Mg. As-built LPBF values above
are rounded typicals from the published range (YS 200-270 MPa, UTS 350-450
MPa) — the fine LPBF microstructure beats the sand-cast alloy substantially.
Thermophysical values are cast-alloy handbook figures; as-built conductivity
is below the cast value.
"""
notes = """
Highly conductive, so it needs high power and low energy density; also very
reflective. A T6 treatment raises yield modestly and costs most of the
as-built ductility. Stress-relieve before removing from the plate — the CTE
is the highest of any metal here and thin sections curl.
"""

[metals."AlSi10Mg".process_window]
process = "lpbf"
laser_power = 370.0               # W
scan_speed = 1.3                  # m/s
hatch_spacing = 1.9e-4            # m
process_layer_height = 3.0e-5     # m
absorptivity = 0.25               # -
preheat_temperature = 150.0       # degC, baseplate (aluminium is preheated hotter)
volumetric_energy_density = 49.9  # J/mm^3
source = "indicative parameter set for a 400 W class machine; not a machine-qualified recipe"

[metals."AlSi10Mg".anisotropy]
yield_z_over_xy = 0.90
ultimate_z_over_xy = 0.88
elongation_z_over_xy = 0.65
am_anisotropy_knockdown = 0.90
source = "indicative; as-built LPBF, Z vs XY"

[metals."AlSi10Mg".corrosion]
pren_applicable = false
seawater_note = """
Not for permanent seawater immersion without a coating and cathodic
protection. Pits in chloride, and it is the most anodic metal in this file, so
in any galvanic couple it is the sacrificial member — a stainless fastener
through an aluminium fairing will eat the fairing. As-built porosity and
surface roughness make it worse. Fine for dry internal spaces and for
short-duration or fully coated external parts.
"""
source = "standard marine practice for aluminium-silicon alloys; indicative"

# ---------------------------------------------------------------------------
# CuNi 90-10 — the seawater piping alloy. Modest strength, excellent
# resistance to seawater and to biofouling, and a hard velocity limit: past
# roughly 2.5-3 m/s the protective film strips and erosion-corrosion starts.
# ---------------------------------------------------------------------------
[metals."CuNi90-10"]
name = "90-10 copper-nickel (C70600)"
family = "copper-nickel alloy"
processes = ["ded_waam", "lpbf"]
density = 8900.0                  # kg/m^3
youngs_modulus = 1.20e11          # Pa
poisson_ratio = 0.33              # -
yield_strength = 1.4e8            # Pa, annealed
ultimate_strength = 3.2e8         # Pa, annealed
cte = 1.70e-5                     # 1/K, 20-100 degC
thermal_conductivity = 40.0       # W/(m K), 20 degC
specific_heat = 380.0             # J/(kg K)
melt_temperature = 1150.0         # degC, liquidus (solidus ~1100)
material_cost_per_kg = 35.0       # indicative wire, per kg
source = """
ASTM B466 / C70600 wrought minima (0.2% YS >= 105 MPa, UTS >= 275 MPa for
annealed tube). Values above are rounded typicals for the annealed condition.
Thermophysical values are C70600 handbook figures. AM properties indicative:
published DED copper-nickel lands near the wrought annealed values.
"""
notes = """
Low strength — this alloy is chosen for its water behaviour, not its numbers,
so a printed CuNi part is usually thickness-driven rather than
strength-driven. Like NAB it is conductive and reflective, so wire-arc / DED
is the practical AM route and powder-bed is difficult.
"""

[metals."CuNi90-10".process_window]
process = "ded_waam"
deposition_rate = 2.5             # kg/h
arc_power = 2800.0                # W (pipeline key: laser_power)
travel_speed = 0.008              # m/s, torch travel
bead_layer_height = 0.002         # m (pipeline key: layer_height)
interpass_temperature_max = 150.0 # degC
source = "indicative wire-arc parameters; not a qualified procedure"

[metals."CuNi90-10".anisotropy]
yield_z_over_xy = 0.90
ultimate_z_over_xy = 0.92
elongation_z_over_xy = 0.85
am_anisotropy_knockdown = 0.90
source = "indicative"

[metals."CuNi90-10".corrosion]
pren_applicable = false
seawater_note = """
The standard alloy for seawater piping and heat exchangers: it forms a
protective cuprous-oxide film, corrodes at a low and predictable general rate,
and its copper ion release suppresses macrofouling without a coating. Three
limits that matter: a flow-velocity ceiling of roughly 2.5-3 m/s in a pipe
before erosion-corrosion strips the film, sensitivity to sulphide-polluted
(harbour) water which prevents the film forming, and susceptibility to
ammonia stress-corrosion cracking. Needs weeks of clean aerated seawater to
develop the film properly — commissioning matters.
"""
source = "standard marine engineering practice for C70600; indicative, no rate quoted"

# ############################################################################
# POLYMERS
#
# Two warnings that apply to every polymer below and that no number here
# captures:
#   * CREEP. A polymer under sustained load keeps deforming. Static strength
#     is nearly irrelevant for a subsea part that holds pressure for years;
#     what matters is the creep-rupture curve at temperature, which is not in
#     this file for any of them.
#   * WATER. Semicrystalline polymers absorb water, which plasticises them,
#     swells them dimensionally, and (for polyamides) can hydrolyse the chain
#     over years at temperature. The polymer that survives is usually the one
#     that does not take the water up in the first place.
#
# `yield_strength` for polymers is the tensile strength at yield of a printed
# XY coupon. The Z value is the one that decides whether an FFF part is worth
# printing: see `z_strength_fraction` in each [*.anisotropy] table, and run
# examples/am-polymer-auv-fairing to see where it comes from.
# ############################################################################

# ---------------------------------------------------------------------------
# PA12-CF — chopped-carbon-filled nylon 12. The default engineering FFF/SLS
# polymer: stiff enough, cheap enough, prints on a heated-bed machine without
# a heated chamber. Absorbs water, which is both a printing problem (dry the
# filament) and a service problem (dimensional swell).
# ---------------------------------------------------------------------------
[polymers."PA12-CF"]
name = "PA12 with chopped carbon fibre (FFF or SLS)"
family = "carbon-filled polyamide"
processes = ["fff", "sls"]
density = 1060.0                  # kg/m^3
youngs_modulus = 4.0e9            # Pa, printed XY
poisson_ratio = 0.40              # -
yield_strength = 6.0e7            # Pa, printed XY
ultimate_strength = 7.0e7         # Pa, printed XY
cte = 5.0e-5                      # 1/K, in-plane, below Tg
thermal_conductivity = 0.30       # W/(m K)
specific_heat = 1800.0            # J/(kg K)
glass_transition_temperature = 50.0   # degC
melt_temperature = 178.0          # degC, crystalline melt
water_absorption_pct = 1.0        # %, saturated, indicative
material_cost_per_kg = 120.0      # indicative filament, per kg
source = """
Indicative literature and datasheet-family values for carbon-filled PA12,
rounded. There is no standard for this material: fibre content, fibre length
and print parameters move the modulus between roughly 3 and 6 GPa across
commercial filaments. Unfilled PA12 baselines (density 1010 kg/m^3, Tg ~45
degC, Tm ~178 degC) are handbook figures.
"""
notes = """
FOR BOND-STRENGTH MODELLING: PA12 is semicrystalline, so its healing
threshold is not Tg. Interdiffusion needs the interface above the
crystallisation temperature, not above the 50 degC Tg — set
glass_transition_temperature in postproc.am.bond_strength to something near
150 degC for this material, or the model will report healing that does not
happen. This is the sharpest edge in the polymer chain and the default will
mislead you.
Dry the filament: PA12 picks up moisture from air in hours and prints with
voids and surface bubbles when wet.
"""

[polymers."PA12-CF".process_window]
process = "fff"
nozzle_temperature = 260.0        # degC
bed_temperature = 100.0           # degC
chamber_temperature = 60.0        # degC (enclosed, not actively heated)
print_speed = 0.04                # m/s
road_width = 6.0e-4               # m (0.6 mm nozzle; abrasive, use a hardened tip)
layer_height = 3.0e-4             # m
source = "indicative starting point for a 0.6 mm hardened nozzle; tune per filament"

[polymers."PA12-CF".anisotropy]
z_strength_fraction = 0.55        # printed Z tensile / printed XY tensile
am_anisotropy_knockdown = 0.55
source = "indicative; FFF interlayer strength for a filled polyamide in an unheated chamber"

[polymers."PA12-CF".seawater]
seawater_note = """
Acceptable for non-structural wet-side parts: fairings, guards, shrouds,
non-pressure housings. Takes up around 1% water at saturation, which
plasticises it (lower modulus, higher toughness) and swells it a few tenths of
a percent — enough to matter for a close-tolerance fit. Long-term hydrolysis
is slow at ambient and accelerates with temperature. It floats, marginally.
"""
source = "indicative; polyamide behaviour in water is well documented qualitatively"

# ---------------------------------------------------------------------------
# PEKK — the subsea structural thermoplastic. Near-zero water uptake,
# hydrolytically stable, and it needs a heated-chamber machine and a hot
# nozzle to print at all. Expensive.
# ---------------------------------------------------------------------------
[polymers."PEKK"]
name = "Polyetherketoneketone (PEKK, 60/40 T/I grade family)"
family = "polyaryletherketone"
processes = ["fff", "sls"]
density = 1300.0                  # kg/m^3
youngs_modulus = 3.8e9            # Pa, printed XY
poisson_ratio = 0.40              # -
yield_strength = 9.5e7            # Pa, printed XY
ultimate_strength = 1.0e8         # Pa, printed XY
cte = 4.7e-5                      # 1/K, below Tg
thermal_conductivity = 0.25       # W/(m K)
specific_heat = 1900.0            # J/(kg K)
glass_transition_temperature = 162.0  # degC
melt_temperature = 305.0          # degC, crystalline melt
water_absorption_pct = 0.2        # %, saturated, indicative
material_cost_per_kg = 700.0      # indicative filament, per kg — get a quote
source = """
Indicative values for the PEKK 60/40 (Kepstan 6000-family) datasheet range,
rounded. Tg and Tm vary substantially with the terephthalic/isophthalic ratio:
a 70/30 grade melts nearer 332 degC. Printed-coupon strengths are indicative
of published FFF results and depend strongly on chamber temperature.
"""
notes = """
Needs a genuinely heated chamber (120 degC or more) and a 380-400 degC hot
end. In an unheated machine PEKK delaminates: the interface drops below Tg
before the next road lands and no interdiffusion happens. The chamber
temperature is the single most important process parameter for this material,
which is exactly what examples/am-polymer-auv-fairing is set up to show.
Crystallinity depends on the cooling rate, so an annealed part and an
as-printed part are different materials.
"""

[polymers."PEKK".process_window]
process = "fff"
nozzle_temperature = 380.0        # degC
bed_temperature = 140.0           # degC
chamber_temperature = 120.0       # degC — mandatory, not optional
print_speed = 0.03                # m/s
road_width = 6.0e-4               # m
layer_height = 4.0e-4             # m
source = "indicative starting point for a heated-chamber machine; tune per grade"

[polymers."PEKK".anisotropy]
z_strength_fraction = 0.70
am_anisotropy_knockdown = 0.70
source = "indicative; a hot chamber narrows the XY/Z gap considerably versus an open machine"

[polymers."PEKK".seawater]
seawater_note = """
One of the few polymers genuinely suited to long-duration subsea structural
use: water uptake around 0.2%, hydrolytically stable in hot water and steam,
resistant to hydraulic fluids and to most subsea chemicals, and dimensionally
stable. Creep is the design driver, not corrosion. Denser than seawater, so it
does not contribute buoyancy.
"""
source = "indicative; PAEK-family behaviour in water is well documented qualitatively"

# ---------------------------------------------------------------------------
# PEEK — the better-known sibling. Slightly stiffer and much better
# characterised than PEKK, with a higher melt temperature that makes it harder
# to print. If you can buy qualification data for a polymer, it is this one.
# ---------------------------------------------------------------------------
[polymers."PEEK"]
name = "Polyetheretherketone (PEEK, 450G-family)"
family = "polyaryletherketone"
processes = ["fff", "sls"]
density = 1300.0                  # kg/m^3
youngs_modulus = 3.9e9            # Pa, printed XY
poisson_ratio = 0.40              # -
yield_strength = 1.0e8            # Pa, printed XY
ultimate_strength = 1.0e8         # Pa, printed XY
cte = 4.7e-5                      # 1/K, below Tg
thermal_conductivity = 0.25       # W/(m K)
specific_heat = 1900.0            # J/(kg K)
glass_transition_temperature = 143.0  # degC
melt_temperature = 343.0          # degC, crystalline melt
water_absorption_pct = 0.5        # %, saturated, indicative
material_cost_per_kg = 500.0      # indicative filament, per kg
source = """
Indicative values for the unfilled PEEK 450G datasheet family (Tg 143 degC,
Tm 343 degC, density 1300 kg/m^3, tensile strength ~100 MPa), rounded.
Printed-coupon values are indicative of published FFF results.
"""
notes = """
Harder to print than PEKK because of the 343 degC melt: nozzle 400-430 degC,
chamber as hot as the machine allows. The XY/Z gap is larger than PEKK's for
the same machine because the crystallisation window is narrower. Annealing is
usually required to reach the datasheet stiffness.
"""

[polymers."PEEK".process_window]
process = "fff"
nozzle_temperature = 400.0        # degC
bed_temperature = 150.0           # degC
chamber_temperature = 130.0       # degC — mandatory
print_speed = 0.025               # m/s
road_width = 6.0e-4               # m
layer_height = 4.0e-4             # m
source = "indicative starting point for a heated-chamber machine; tune per grade"

[polymers."PEEK".anisotropy]
z_strength_fraction = 0.65
am_anisotropy_knockdown = 0.65
source = "indicative; heavily dependent on chamber temperature and on post-print annealing"

[polymers."PEEK".seawater]
seawater_note = """
Excellent: hydrolytically stable in hot water and steam, low water uptake,
chemically resistant, and it has more published subsea service history than
any other printable thermoplastic. As with PEKK, creep and not corrosion sets
the section. Denser than seawater.
"""
source = "indicative; extensive qualitative literature, no single citable rate"

# ---------------------------------------------------------------------------
# PVDF — the chemically bulletproof fluoropolymer. Lowest water absorption
# here, excellent UV and seawater resistance, low stiffness. Used for cable
# jackets and flexible-pipe liners for exactly these reasons.
# ---------------------------------------------------------------------------
[polymers."PVDF"]
name = "Polyvinylidene fluoride (PVDF homopolymer, Kynar-family)"
family = "fluoropolymer"
processes = ["fff"]
density = 1780.0                  # kg/m^3
youngs_modulus = 2.0e9            # Pa, printed XY
poisson_ratio = 0.38              # -
yield_strength = 5.0e7            # Pa, printed XY
ultimate_strength = 5.0e7         # Pa, printed XY
cte = 1.30e-4                     # 1/K, above Tg (i.e. at service temperature)
thermal_conductivity = 0.19       # W/(m K)
specific_heat = 1300.0            # J/(kg K)
glass_transition_temperature = -35.0  # degC — below any service temperature
melt_temperature = 172.0          # degC, crystalline melt
water_absorption_pct = 0.04       # %, saturated, indicative
material_cost_per_kg = 150.0      # indicative filament, per kg
source = """
Indicative values for the PVDF homopolymer (Kynar-family) datasheet range,
rounded. Copolymer grades are softer and tougher with a lower melt point.
Printed-coupon values are indicative.
"""
notes = """
SAFETY: PVDF releases hydrogen fluoride if overheated. Keep the nozzle below
about 260 degC, ventilate the enclosure, and do not chase a bond-strength
problem by cranking the temperature.
Tg is well below service temperature, so PVDF is always in its rubbery state
in use: the CTE above is the high-temperature one, and it is large.
Bond-strength modelling should key off the melt temperature, not Tg.
"""

[polymers."PVDF".process_window]
process = "fff"
nozzle_temperature = 240.0        # degC — do not exceed ~260 degC, see notes
bed_temperature = 100.0           # degC
chamber_temperature = 60.0        # degC
print_speed = 0.03               # m/s
road_width = 6.0e-4               # m
layer_height = 3.0e-4             # m
source = "indicative starting point; tune per grade, respect the temperature ceiling"

[polymers."PVDF".anisotropy]
z_strength_fraction = 0.60
am_anisotropy_knockdown = 0.60
source = "indicative"

[polymers."PVDF".seawater]
seawater_note = """
Outstanding. Water absorption around 0.04% — effectively nil — plus excellent
UV, chlorine and hydrocarbon resistance, which is why it is the material of
choice for subsea cable jackets and for the internal pressure sheath of
flexible pipe. Low stiffness means sections are thickness-driven. Denser than
seawater.
"""
source = "standard subsea materials practice for PVDF; indicative"

# ---------------------------------------------------------------------------
# HDPE — the cheap one that floats. Chemically inert, zero water uptake, and
# less dense than seawater, which makes it the default for non-structural
# subsea housings and float bodies. Creeps badly and is a pain to print.
# ---------------------------------------------------------------------------
[polymers."HDPE"]
name = "High-density polyethylene (PE100 / extrusion grade)"
family = "polyolefin"
processes = ["fff"]
density = 960.0                   # kg/m^3 — LESS than seawater: it floats
youngs_modulus = 1.0e9            # Pa, printed XY
poisson_ratio = 0.42              # -
yield_strength = 2.5e7            # Pa, printed XY
ultimate_strength = 3.0e7         # Pa, printed XY
cte = 1.50e-4                     # 1/K
thermal_conductivity = 0.45       # W/(m K)
specific_heat = 1900.0            # J/(kg K)
glass_transition_temperature = -110.0  # degC
melt_temperature = 130.0          # degC, crystalline melt
water_absorption_pct = 0.01       # %, effectively nil
material_cost_per_kg = 40.0       # indicative filament, per kg
source = """
Indicative values for the PE100 / HDPE extrusion-grade datasheet range,
rounded. Printed-coupon values are indicative and typically below the
extrusion-grade figures because of poor interlayer bonding.
"""
notes = """
The hardest material here to print well: a CTE of 1.5e-4 /K and high
crystallinity mean it shrinks and warps off almost any bed surface. Print on a
PE sheet, keep the part small, expect warping anyway. Creep is severe — HDPE
under sustained load at ambient will keep moving for years, so it is not a
structural material regardless of what the yield number says. UV degrades it
unless it is carbon-black filled.
"""

[polymers."HDPE".process_window]
process = "fff"
nozzle_temperature = 230.0        # degC
bed_temperature = 100.0           # degC, on a PE build surface
chamber_temperature = 50.0        # degC
print_speed = 0.03                # m/s
road_width = 6.0e-4               # m
layer_height = 3.0e-4             # m
source = "indicative starting point; warping dominates, tune per machine"

[polymers."HDPE".anisotropy]
z_strength_fraction = 0.50
am_anisotropy_knockdown = 0.50
source = "indicative; polyolefin interlayer bonding in FFF is poor"

[polymers."HDPE".seawater]
seawater_note = """
Chemically inert in seawater, effectively zero water uptake, and buoyant at
960 kg/m^3 — the reason it is used for float bodies, non-structural housings
and fairings. Nothing corrodes it. Everything creeps it. Not for pressure
containment or for any part that carries a sustained load.
"""
source = "standard practice for HDPE in marine service; indicative"

# ############################################################################
# WHAT IS DELIBERATELY NOT IN THIS FILE
#
# * Fatigue data of any kind. As-built AM surfaces knock fatigue strength down
#   hard — often by half against machined-and-HIPed material — and a single
#   number cannot represent that. If your part sees cyclic load, you need
#   coupons.
# * Fracture toughness and crack-growth data. Same reason.
# * Temperature-dependent property curves. Every value here is at or near
#   20 degC unless stated.
# * HIPed, annealed and aged conditions as separate entries. Several materials
#   change character completely with heat treatment (2507 most of all) and the
#   notes say so, but there is one row per material and it is the as-built one
#   unless the source line says otherwise.
# * Creep-rupture curves for the polymers, which is the property that actually
#   sizes a long-duration subsea polymer part.
# * Any allowable, factor of safety, or class-approved value. There are none
#   here. That is the point of the header.
# ############################################################################
