[plugin]
id            = "dev.souxmar.examples.am-layered-mesher"
name          = "AM Layered Voxel Mesher"
version       = "0.1.0"
abi           = 1
license       = "Apache-2.0"
homepage      = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-layered-mesher"

description   = "Layer-aligned structured Hex8 build mesh for additive-manufacturing process simulation. Cell tag = layer index; outer faces tagged 10..15 per side."
documentation = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/am-layered-mesher"
tags          = ["mesher", "additive-manufacturing", "am", "layered", "hex8", "voxel"]
min_souxmar_abi_minor = 0

[plugin.binary]
file          = "libam_layered_mesher.so"

[plugin.capabilities]
provides      = ["mesher.am.layered"]

[plugin.threading]
model         = "reentrant"

[plugin.dependencies]
souxmar       = ">=0.0.1,<2.0"
