[plugin]
id            = "dev.souxmar.examples.am-manufacturability"
name          = "AM Manufacturability Checks"
version       = "0.1.0"
abi           = 1
license       = "Apache-2.0"
homepage      = "https://github.com/souxmar/souxmar/tree/main/examples/plugins/am-manufacturability"

description   = "Design-for-additive-manufacturing checks: per-cell overhang/support need, a composite printability score, and per-layer build time from the mesh's own boundary facets."
documentation = "https://souxmar.dev/docs/plugins/am-manufacturability"
tags          = ["solver", "additive-manufacturing", "dfam", "overhang", "printability", "build-time"]
min_souxmar_abi_minor = 0

[plugin.binary]
file          = "libam_manufacturability.so"

[plugin.capabilities]
provides      = ["solver.am.overhang", "solver.am.printability", "solver.am.buildtime"]

[plugin.threading]
model         = "reentrant"

[plugin.dependencies]
souxmar       = ">=0.0.1,<2.0"
