[plugin]
id            = "dev.souxmar.examples.marine"
name          = "Marine / Subsea Loads and Integrity"
version       = "0.1.0"
abi           = 1
license       = "Apache-2.0"
homepage      = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/marine"

description   = "Closed-form marine engineering set: seawater hydrostatic load cases, preliminary pressure-hull collapse margin, seawater corrosion / pitting / galvanic indicators, and an advisory AM qualification dossier. Preliminary design aids, not classification-society calculations."
documentation = "https://github.com/celikgo/souxmar/tree/master/examples/plugins/marine"
tags          = ["solver", "writer", "marine", "subsea", "hydrostatic", "pressure-hull", "corrosion", "galvanic", "qualification", "additive-manufacturing"]
min_souxmar_abi_minor = 0

[plugin.binary]
file          = "libmarine_loads.so"

[plugin.capabilities]
provides      = [
  "solver.marine.hydrostatic",
  "solver.marine.hull_collapse",
  "solver.marine.corrosion",
  "writer.marine.qualification_report",
]

[plugin.threading]
model         = "reentrant"

[plugin.dependencies]
souxmar       = ">=0.0.1,<2.0"
