# Sprint 6 push 4 — the first souxmar pipeline driven by a real input
# file. The unit cube is twelve triangles in ASCII STL form, which
# reader.stl reads and deduplicates into an 8-node / 12-cell Tri3 mesh,
# postproc.mesh_quality reports per-cell quality on, and writer.vtu
# saves for ParaView.
version: 1
stages:
  - id: read
    plugin: reader.stl
    input:
      path: cube.stl

  # postproc.* is field-in / field-out by definition, so the dispatcher
  # requires a `field:` on every postproc stage. postproc.mesh_quality then
  # ignores it — it reads the mesh — but something has to produce one, which
  # is what this stage is for. solver.heat.linear is a closed-form
  # demonstration stub (see docs/CAPABILITIES.md); nothing here is a heat
  # analysis, it is the cheapest field producer in the tree.
  - id: seed
    plugin: solver.heat.linear
    input:
      mesh: { from: read }
      num_time_steps: 1

  - id: quality
    plugin: postproc.mesh_quality
    input:
      mesh:  { from: read }
      field: { from: seed }

  - id: write
    plugin: writer.vtu
    input:
      mesh:  { from: read }
      field: { from: quality }
      path:  cube.vtu
